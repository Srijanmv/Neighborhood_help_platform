<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neighborhood Help Map</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #eef3ef;
    }
    body.dark { background: #202124; color: #e8eaed; }
    #map { width: 100vw; height: 100vh; }
    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(320px, 448px) minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      pointer-events: none;
    }
    .search-box {
      pointer-events: auto;
      height: 56px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 48px 48px;
      align-items: center;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.28);
      overflow: hidden;
    }
    body.dark .search-box,
    body.dark .chip,
    body.dark .panel,
    body.dark .control-stack,
    body.dark .layers-card,
    body.dark .status-pill {
      background: #303134;
      color: #e8eaed;
      border-color: rgba(255,255,255,0.12);
    }
    .search-box input {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 16px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      margin: 0 auto;
      border: 0;
      border-radius: 999px;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: transparent;
      color: #5f6368;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
    }
    body.dark .icon-btn { color: #bdc1c6; }
    .icon-btn:hover { background: #f1f3f4; }
    body.dark .icon-btn:hover { background: #3c4043; }
    .blue { color: #1a73e8; }
    .chips {
      pointer-events: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      min-height: 56px;
    }
    .chip {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 10px 14px;
      background: #fff;
      color: #202124;
      box-shadow: 0 1px 5px rgba(60, 64, 67, 0.22);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip:hover, .chip.active { background: #e8f0fe; color: #1967d2; }
    body.dark .chip:hover, body.dark .chip.active { background: #263850; color: #8ab4f8; }
    .account {
      pointer-events: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: end;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      border: 3px solid #fff;
      background: #0097a7;
      color: #fff;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.28);
    }
    .panel {
      position: absolute;
      z-index: 10;
      left: 14px;
      top: 84px;
      width: min(424px, calc(100vw - 28px));
      max-height: calc(100vh - 124px);
      overflow: auto;
      display: none;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(60, 64, 67, 0.3);
    }
    .panel.open { display: block; }
    .panel-main { padding: 18px 18px 10px; display: grid; gap: 7px; }
    .panel-title { font-size: 20px; font-weight: 800; line-height: 1.25; }
    .panel-text { color: #5f6368; font-size: 13px; line-height: 1.5; }
    body.dark .panel-text { color: #bdc1c6; }
    .panel-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 18px 16px;
      border-top: 1px solid #f1f3f4;
    }
    body.dark .panel-actions { border-color: #3c4043; }
    .pill-action {
      border: 1px solid #dadce0;
      border-radius: 999px;
      background: transparent;
      color: #1a73e8;
      padding: 9px 13px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }
    body.dark .pill-action { border-color: #5f6368; color: #8ab4f8; }
    .side-controls {
      position: absolute;
      right: 20px;
      bottom: 88px;
      z-index: 10;
      display: grid;
      gap: 12px;
    }
    .control-stack {
      display: grid;
      overflow: hidden;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 1px 6px rgba(60, 64, 67, 0.3);
    }
    .control-stack .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 0;
      border-bottom: 1px solid #f1f3f4;
    }
    .control-stack .icon-btn:last-child { border-bottom: 0; }
    body.dark .control-stack .icon-btn { border-color: #3c4043; }
    .layers-card {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      width: 92px;
      height: 92px;
      border: 0;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 1px 8px rgba(60,64,67,0.35);
      background:
        linear-gradient(135deg, rgba(34,197,94,0.34), rgba(59,130,246,0.28)),
        #dbeafe;
    }
    .layers-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(28deg, transparent 48%, rgba(255,255,255,0.82) 49%, rgba(255,255,255,0.82) 51%, transparent 52%),
        linear-gradient(120deg, transparent 42%, rgba(20,83,45,0.30) 43%, rgba(20,83,45,0.30) 46%, transparent 47%);
    }
    .layers-card span {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px;
      color: #fff;
      font-weight: 900;
      font-size: 12px;
      text-align: left;
      background: linear-gradient(transparent, rgba(0,0,0,0.66));
    }
    .status-pill {
      position: absolute;
      left: 126px;
      bottom: 22px;
      z-index: 10;
      max-width: min(560px, calc(100vw - 260px));
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.96);
      color: #5f6368;
      font-size: 13px;
      box-shadow: 0 1px 6px rgba(60,64,67,0.28);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast {
      position: absolute;
      left: 50%;
      bottom: 34px;
      z-index: 20;
      transform: translateX(-50%);
      max-width: min(440px, calc(100vw - 32px));
      display: none;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(32,33,36,0.94);
      color: #fff;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .toast.show { display: block; }
    @media (max-width: 880px) {
      .top-bar { grid-template-columns: 1fr auto; }
      .chips {
        grid-column: 1 / -1;
        order: 3;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 2px;
      }
    }
    @media (max-width: 560px) {
      .top-bar { left: 8px; right: 8px; top: 8px; grid-template-columns: 1fr; }
      .search-box { grid-template-columns: 44px minmax(0, 1fr) 44px 44px; }
      .account { position: absolute; top: 66px; right: 0; }
      .panel { left: 8px; top: 132px; width: calc(100vw - 16px); max-height: 42vh; }
      .side-controls { right: 10px; bottom: 76px; }
      .layers-card { left: 10px; bottom: 10px; width: 82px; height: 82px; }
      .status-pill { left: 102px; right: 10px; bottom: 18px; max-width: none; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="top-bar">
    <form class="search-box" id="searchForm">
      <button class="icon-btn" type="button" id="menuButton" title="Menu">=</button>
      <input id="searchInput" type="search" placeholder="Search Google Maps">
      <button class="icon-btn" type="submit" title="Search">O</button>
      <button class="icon-btn blue" type="button" id="directionsButton" title="Directions">D</button>
    </form>

    <div class="chips">
      <button class="chip" type="button" data-query="restaurants near Gorakhpur">Restaurants</button>
      <button class="chip" type="button" data-query="hotels near Gorakhpur">Hotels</button>
      <button class="chip" type="button" data-query="hospitals near Gorakhpur">Hospitals</button>
      <button class="chip" type="button" data-query="Gorakhpur Airport">Airport</button>
      <button class="chip" type="button" id="trafficButton">Traffic</button>
      <button class="chip" type="button" id="transitButton">Transit</button>
      <button class="chip" type="button" id="bikeButton">Bike</button>
      <button class="chip" type="button" id="darkButton">Dark</button>
    </div>

    <div class="account">
      <button class="icon-btn panel" type="button" id="moreButton" title="More">...</button>
      <div class="avatar">S</div>
    </div>
  </div>

  <section class="panel" id="resultPanel">
    <div class="panel-main">
      <div class="panel-title" id="resultTitle">Selected location</div>
      <div class="panel-text" id="resultAddress">Search or click on the map to see details here.</div>
      <div class="panel-text" id="routeSummary"></div>
    </div>
    <div class="panel-actions">
      <button class="pill-action" type="button" id="routeHereButton">Route here</button>
      <button class="pill-action" type="button" id="copyCoordsButton">Copy coords</button>
      <button class="pill-action" type="button" id="clearRouteButton">Clear route</button>
      <button class="pill-action" type="button" id="closePanelButton">Close</button>
    </div>
  </section>

  <button class="layers-card" id="layersButton" type="button"><span>Layers</span></button>

  <div class="side-controls">
    <div class="control-stack">
      <button class="icon-btn" type="button" id="locateButton" title="Your location">+</button>
    </div>
    <div class="control-stack">
      <button class="icon-btn" type="button" id="zoomInButton" title="Zoom in">+</button>
      <button class="icon-btn" type="button" id="zoomOutButton" title="Zoom out">-</button>
    </div>
    <div class="control-stack">
      <button class="icon-btn" type="button" id="fullscreenButton" title="Fullscreen">[]</button>
    </div>
  </div>

  <div class="status-pill" id="coords">Click the map or search to select a location.</div>
  <div class="toast" id="toast"></div>

  <script>
    if (window.location.hostname === '127.0.0.1') {
      window.location.replace(window.location.href.replace('//127.0.0.1', '//localhost'));
    }

    const defaultCenter = { lat: 26.7606, lng: 83.3732 };
    const darkStyle = [
      { elementType: 'geometry', stylers: [{ color: '#242f3e' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#242f3e' }] },
      { elementType: 'labels.text.fill', stylers: [{ color: '#d6dce3' }] },
      { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers: [{ color: '#8ab4f8' }] },
      { featureType: 'poi', elementType: 'labels.text.fill', stylers: [{ color: '#d6dce3' }] },
      { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#1e3a2f' }] },
      { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#38414e' }] },
      { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#212a37' }] },
      { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#c3cad2' }] },
      { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#52616f' }] },
      { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#2f3948' }] },
      { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#17263c' }] },
      { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#9db2ce' }] }
    ];

    let map;
    let geocoder;
    let placesService;
    let trafficLayer;
    let transitLayer;
    let bikeLayer;
    let directionsService;
    let directionsRenderer;
    let marker;
    let userMarker;
    let selectedLatLng = null;
    let selectedAddress = '';
    let userLatLng = null;
    let toastTimer = null;
    let satelliteOn = false;
    let darkOn = false;

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function setStatus(message) {
      document.getElementById('coords').textContent = message;
    }

    function openResult(title, address, latLng) {
      selectedLatLng = latLng;
      selectedAddress = address || '';
      document.getElementById('resultTitle').textContent = title || 'Selected location';
      document.getElementById('resultAddress').textContent = address || `${latLng.lat().toFixed(5)}, ${latLng.lng().toFixed(5)}`;
      document.getElementById('resultPanel').classList.add('open');
      setStatus(`${latLng.lat().toFixed(5)}, ${latLng.lng().toFixed(5)}`);
    }

    function setMarker(latLng, title, address) {
      if (!marker) {
        marker = new google.maps.Marker({
          position: latLng,
          map,
          draggable: true,
          animation: google.maps.Animation.DROP,
          title: title || 'Selected location'
        });
        marker.addListener('dragend', () => reverseGeocode(marker.getPosition(), 'Pinned location'));
      } else {
        marker.setPosition(latLng);
        marker.setTitle(title || 'Selected location');
      }
      openResult(title || 'Selected location', address, latLng);
    }

    function reverseGeocode(latLng, title) {
      geocoder.geocode({ location: latLng }, (results, status) => {
        const address = status === 'OK' && results && results[0] ? results[0].formatted_address : '';
        setMarker(latLng, title || 'Selected location', address);
      });
    }

    function searchWithGeocoder(query) {
      geocoder.geocode({ address: query }, (results, status) => {
        if (status !== 'OK' || !results || !results[0]) {
          showToast('No result found. Try a more specific search.');
          return;
        }
        const result = results[0];
        map.panTo(result.geometry.location);
        map.setZoom(15);
        setMarker(result.geometry.location, query, result.formatted_address);
      });
    }

    function searchPlace(query) {
      const value = String(query || '').trim();
      if (!value) {
        showToast('Type a place or address to search.');
        return;
      }
      setStatus(`Searching: ${value}`);
      if (placesService && google.maps.places) {
        placesService.textSearch({ query: value, location: map.getCenter(), radius: 45000 }, (results, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK && results && results[0]) {
            const place = results[0];
            map.panTo(place.geometry.location);
            map.setZoom(15);
            setMarker(place.geometry.location, place.name || value, place.formatted_address || place.vicinity || '');
            return;
          }
          searchWithGeocoder(value);
        });
      } else {
        searchWithGeocoder(value);
      }
    }

    function useCurrentLocation(zoomToUser = true) {
      if (!navigator.geolocation) {
        showToast('Live location is not supported in this browser.');
        return;
      }
      showToast('Finding your location...');
      navigator.geolocation.getCurrentPosition(position => {
        userLatLng = new google.maps.LatLng(position.coords.latitude, position.coords.longitude);
        if (!userMarker) {
          userMarker = new google.maps.Marker({
            position: userLatLng,
            map,
            title: 'Your location',
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 8,
              strokeColor: '#ffffff',
              strokeWeight: 3,
              fillColor: '#1a73e8',
              fillOpacity: 1
            }
          });
        } else {
          userMarker.setPosition(userLatLng);
        }
        if (zoomToUser) {
          map.panTo(userLatLng);
          map.setZoom(16);
        }
        setStatus(`Your location: ${userLatLng.lat().toFixed(5)}, ${userLatLng.lng().toFixed(5)}`);
      }, () => {
        showToast('Location permission is blocked or unavailable.');
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 });
    }

    function drawRoute() {
      if (!selectedLatLng) {
        showToast('Select a destination first.');
        return;
      }
      if (!userLatLng) {
        showToast('Use My Location first, then route.');
        useCurrentLocation(false);
        return;
      }
      directionsService.route({
        origin: userLatLng,
        destination: selectedLatLng,
        travelMode: google.maps.TravelMode.DRIVING
      }, (result, status) => {
        if (status !== 'OK' || !result || !result.routes.length) {
          showToast('Route could not be created.');
          return;
        }
        directionsRenderer.setDirections(result);
        const leg = result.routes[0].legs[0];
        document.getElementById('routeSummary').textContent =
          `${leg.distance ? leg.distance.text : '-'} - ${leg.duration ? leg.duration.text : '-'} by car`;
        showToast('Route is ready.');
      });
    }

    function toggleButton(button, enabled) {
      button.classList.toggle('active', enabled);
    }

    function initMap() {
      geocoder = new google.maps.Geocoder();
      trafficLayer = new google.maps.TrafficLayer();
      transitLayer = new google.maps.TransitLayer();
      bikeLayer = new google.maps.BicyclingLayer();
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({
        suppressMarkers: false,
        polylineOptions: { strokeColor: '#1a73e8', strokeOpacity: 0.95, strokeWeight: 6 }
      });

      map = new google.maps.Map(document.getElementById('map'), {
        center: defaultCenter,
        zoom: 12,
        mapTypeControl: false,
        streetViewControl: true,
        fullscreenControl: false,
        zoomControl: false,
        clickableIcons: true,
        gestureHandling: 'greedy'
      });
      directionsRenderer.setMap(map);
      if (google.maps.places) {
        placesService = new google.maps.places.PlacesService(map);
      }

      map.addListener('click', event => reverseGeocode(event.latLng, 'Selected location'));

      document.getElementById('searchForm').addEventListener('submit', event => {
        event.preventDefault();
        searchPlace(document.getElementById('searchInput').value);
      });

      document.querySelectorAll('[data-query]').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.chip.active').forEach(chip => {
            if (chip.hasAttribute('data-query')) chip.classList.remove('active');
          });
          button.classList.add('active');
          document.getElementById('searchInput').value = button.dataset.query;
          searchPlace(button.dataset.query);
        });
      });

      document.getElementById('layersButton').addEventListener('click', () => {
        satelliteOn = !satelliteOn;
        map.setMapTypeId(satelliteOn ? 'hybrid' : 'roadmap');
        showToast(satelliteOn ? 'Satellite layer enabled.' : 'Default map enabled.');
      });

      document.getElementById('trafficButton').addEventListener('click', event => {
        const active = !event.currentTarget.classList.contains('active');
        trafficLayer.setMap(active ? map : null);
        toggleButton(event.currentTarget, active);
      });

      document.getElementById('transitButton').addEventListener('click', event => {
        const active = !event.currentTarget.classList.contains('active');
        transitLayer.setMap(active ? map : null);
        toggleButton(event.currentTarget, active);
      });

      document.getElementById('bikeButton').addEventListener('click', event => {
        const active = !event.currentTarget.classList.contains('active');
        bikeLayer.setMap(active ? map : null);
        toggleButton(event.currentTarget, active);
      });

      document.getElementById('darkButton').addEventListener('click', event => {
        darkOn = !darkOn;
        document.body.classList.toggle('dark', darkOn);
        map.setOptions({ styles: darkOn ? darkStyle : null });
        event.currentTarget.textContent = darkOn ? 'Light' : 'Dark';
        toggleButton(event.currentTarget, darkOn);
      });

      document.getElementById('locateButton').addEventListener('click', () => useCurrentLocation(true));
      document.getElementById('directionsButton').addEventListener('click', drawRoute);
      document.getElementById('routeHereButton').addEventListener('click', drawRoute);
      document.getElementById('zoomInButton').addEventListener('click', () => map.setZoom(map.getZoom() + 1));
      document.getElementById('zoomOutButton').addEventListener('click', () => map.setZoom(map.getZoom() - 1));
      document.getElementById('clearRouteButton').addEventListener('click', () => {
        directionsRenderer.set('directions', null);
        document.getElementById('routeSummary').textContent = '';
        showToast('Route cleared.');
      });
      document.getElementById('closePanelButton').addEventListener('click', () => document.getElementById('resultPanel').classList.remove('open'));
      document.getElementById('copyCoordsButton').addEventListener('click', () => {
        if (!selectedLatLng) {
          showToast('Select a location first.');
          return;
        }
        const text = `${selectedLatLng.lat().toFixed(7)}, ${selectedLatLng.lng().toFixed(7)}`;
        navigator.clipboard?.writeText(text);
        showToast('Coordinates copied.');
      });
      document.getElementById('fullscreenButton').addEventListener('click', () => {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      });
      document.getElementById('menuButton').addEventListener('click', () => showToast('Neighborhood Help map tools'));
      document.getElementById('moreButton').addEventListener('click', () => showToast('Traffic, transit, bike, dark mode and routes are available.'));

      useCurrentLocation(false);
    }
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCQgMW-ng1mUtLief4dSI5yOfmwD6tSwf4&callback=initMap&libraries=places&loading=async"></script>
</body>
</html>
